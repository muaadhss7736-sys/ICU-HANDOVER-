name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare www folder
        run: |
          mkdir -p www/icons
          cp index.html app.js parser.js pdf.js styles.css sw.js manifest.webmanifest www/
          cp icon-192.png icon-512.png maskable-512.png www/icons/
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Add OCR engine (optional - build continues if this fails)
        continue-on-error: true
        run: |
          npm install --no-save tesseract.js@5.1.1 @tesseract.js-data/eng
          T=www/vendor/tesseract
          mkdir -p $T/lang
          cp node_modules/tesseract.js/dist/tesseract.min.js node_modules/tesseract.js/dist/worker.min.js $T/
          cp node_modules/tesseract.js-core/tesseract-core*.wasm.js $T/
          cp "$(find node_modules/@tesseract.js-data/eng -name eng.traineddata.gz | head -1)" $T/lang/eng.traineddata.gz
          ls -la $T $T/lang
      - run: npx cap add android
      - name: Set app icon
        run: |
          R=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icon-512.png $R/mipmap-$d/ic_launcher.png
            cp icon-512.png $R/mipmap-$d/ic_launcher_round.png
            cp launcher-foreground.png $R/mipmap-$d/ic_launcher_foreground.png
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0B2A3C</color>\n</resources>\n' > $R/values/ic_launcher_background.xml
      - name: Add camera permission
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Use fixed signing key (so future updates install over the old app without deleting data)
        run: |
          if [ -f debug.keystore ]; then mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore; fi
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IBN-SINA-ICU-HANDOVER-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
