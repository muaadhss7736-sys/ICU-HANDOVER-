name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare www folder
        run: |
          mkdir -p www/icons
          cp index.html app.js parser.js pdf.js styles.css sw.js manifest.webmanifest www/
          cp icon-192.png icon-512.png maskable-512.png www/icons/
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Add OCR engine (npm first, download fallback; the build FAILS if any file is missing)
        run: |
          T=www/vendor/tesseract
          mkdir -p $T/lang
          npm install --no-save tesseract.js@5.1.1 @tesseract.js-data/eng || true
          cp node_modules/tesseract.js/dist/tesseract.min.js node_modules/tesseract.js/dist/worker.min.js $T/ 2>/dev/null || true
          cp node_modules/tesseract.js-core/tesseract-core*.wasm.js $T/ 2>/dev/null || true
          L=$(find node_modules/@tesseract.js-data/eng -path '*4.0.0_best_int*' -name eng.traineddata.gz 2>/dev/null | head -1)
          if [ -z "$L" ]; then L=$(find node_modules/@tesseract.js-data/eng -name eng.traineddata.gz 2>/dev/null | head -1); fi
          if [ -n "$L" ]; then gunzip -c "$L" > $T/lang/eng.traineddata; fi
          J=https://cdn.jsdelivr.net/npm
          for f in tesseract.min.js worker.min.js; do [ -s $T/$f ] || curl -fsSL $J/tesseract.js@5.1.1/dist/$f -o $T/$f || true; done
          for f in tesseract-core tesseract-core-simd tesseract-core-lstm tesseract-core-simd-lstm; do [ -s $T/$f.wasm.js ] || curl -fsSL $J/tesseract.js-core@5.1.1/$f.wasm.js -o $T/$f.wasm.js || true; done
          if [ ! -s $T/lang/eng.traineddata ]; then curl -fsSL https://github.com/naptha/tessdata/raw/gh-pages/4.0.0_fast/eng.traineddata.gz -o /tmp/eng.gz && gunzip -c /tmp/eng.gz > $T/lang/eng.traineddata || true; fi
          ls -la $T $T/lang
          for f in tesseract.min.js worker.min.js tesseract-core.wasm.js tesseract-core-simd.wasm.js tesseract-core-lstm.wasm.js tesseract-core-simd-lstm.wasm.js lang/eng.traineddata; do
            if [ ! -s $T/$f ]; then echo "::error::OCR engine file missing: $f"; exit 1; fi
          done
      - run: npx cap add android
      - name: Set app icon
        run: |
          R=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icon-512.png $R/mipmap-$d/ic_launcher.png
            cp icon-512.png $R/mipmap-$d/ic_launcher_round.png
            cp launcher-foreground.png $R/mipmap-$d/ic_launcher_foreground.png
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0B2A3C</color>\n</resources>\n' > $R/values/ic_launcher_background.xml
      - name: Add camera permission
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Use fixed signing key (so future updates install over the old app without deleting data)
        run: |
          if [ -f debug.keystore ]; then mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore; fi
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IBN-SINA-ICU-HANDOVER-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
